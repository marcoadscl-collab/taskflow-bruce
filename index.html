<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TaskFlow · Bruce</title>
<meta name="theme-color" content="#0a0c08">
<meta name="description" content="Planificador personal con Bruce, tu asistente. Todo local, sin cuentas.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TaskFlow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230a0c08'/%3E%3Cpath d='M33 22c-11 2-19 12-20 24-1 10 4 17 10 17 6 0 10-7 12-17 2-9 1-17-2-24z' fill='%2315160f' stroke='%233b422f' stroke-width='2'/%3E%3Cpath d='M67 22c11 2 19 12 20 24 1 10-4 17-10 17-6 0-10-7-12-17-2-9-1-17 2-24z' fill='%2315160f' stroke='%233b422f' stroke-width='2'/%3E%3Cpath d='M50 18c18 0 28 12 28 29 0 11-3 21-8 27-5 6-11 8-20 8s-15-2-20-8c-5-6-8-16-8-27 0-17 10-29 28-29z' fill='%231f2119' stroke='%233b422f' stroke-width='2'/%3E%3Cpath d='M50 19c6 6 9 15 8 27H42c-1-12 2-21 8-27z' fill='%23f2f4e9'/%3E%3Cellipse cx='50' cy='70' rx='16' ry='12' fill='%23f2f4e9'/%3E%3Cpath d='M50 68c-4 0-7-2-7-4s3-3 7-3 7 1 7 3-3 4-7 4z' fill='%2315160f'/%3E%3Crect x='23' y='40' width='23' height='15' rx='7' fill='%23c8f04a' stroke='%230e0f0a' stroke-width='2.5'/%3E%3Crect x='54' y='40' width='23' height='15' rx='7' fill='%23c8f04a' stroke='%230e0f0a' stroke-width='2.5'/%3E%3Cpath d='M46 47.5h8' stroke='%230e0f0a' stroke-width='3.4' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#eff3e4; --panel:#ffffff; --panel2:#f5f8ec; --text:#11140d; --muted:#6d7365;
  --line:#e0e6d3; --accent:#c8f04a; --accent-ink:#4b6a0c; --accent-soft:#edf8cf; --on-accent:#11140d;
  --ok:#7fc42a; --hi:#e5484d; --mid:#e0a800; --low:#c2c9b6;
  --hi-soft:#fdf1f1;
  --shadow:0 1px 2px rgba(17,20,13,.04), 0 8px 26px rgba(17,20,13,.06);
  --r:22px; --r-sm:14px;
}
html[data-theme="dark"]{
  --bg:#0a0c08; --panel:#161a13; --panel2:#1f241c; --text:#f1f5ea; --muted:#8e9686;
  --line:#262d21; --accent:#c8f04a; --accent-ink:#c8f04a; --accent-soft:#1d2616; --on-accent:#10140b;
  --ok:#c8f04a; --hi:#ff6b6b; --mid:#f5c945; --low:#3b4434;
  --hi-soft:#231a1a;
  --shadow:0 1px 2px rgba(0,0,0,.55), 0 12px 32px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  font-size:14.5px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:7px}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:9px}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:238px 1fr;min-height:100vh}
.sidebar{
  border-right:1px solid var(--line); background:var(--panel);
  padding:20px 14px; display:flex; flex-direction:column; gap:4px;
  position:sticky; top:0; height:100vh; overflow-y:auto;
}
/* iconos monocolor */
.svgic{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;display:inline-block;vertical-align:-4px;color:var(--accent-ink)}
.btn.primary .svgic,.pill.active .svgic,.wday.sel .svgic,.toast .svgic{color:var(--on-accent)}
.chip .svgic{width:13px;height:13px;vertical-align:-2px}
.actions .svgic{width:15px;height:15px;color:var(--muted)}
.actions button:hover .svgic{color:var(--accent-ink)}
.tile .svgic{width:21px;height:21px}
.section-title .svgic{width:14px;height:14px}
.rowitem .svgic{width:17px;height:17px}
.rowitem[data-act="reset"] .svgic{color:var(--hi)}
.atime .svgic{display:none}

/* cabecera lateral: fecha, reloj y mini calendario */
.side-head{padding:0 8px 14px;border-bottom:1px solid var(--line);margin-bottom:12px}
.side-date{font-size:11.5px;color:var(--muted);font-weight:600}
.side-clock{font-size:27px;font-weight:750;letter-spacing:-1.2px;margin:1px 0 14px;font-variant-numeric:tabular-nums;line-height:1.1}
.side-clock small{font-size:13px;font-weight:600;color:var(--muted);margin-left:3px;letter-spacing:0}
.mc-head{display:flex;align-items:center;gap:2px;margin-bottom:7px}
.mc-title{flex:1;font-size:11.5px;font-weight:700;text-transform:capitalize}
.mc-nav{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;color:var(--muted)}
.mc-nav:hover{background:var(--panel2)}
.mc-nav .svgic{width:14px;height:14px}
.mc-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.mc-grid small{font-size:9px;color:var(--muted);text-align:center;font-weight:700;padding-bottom:2px}
.mc-d{aspect-ratio:1;border-radius:7px;font-size:11px;display:grid;place-items:center;position:relative;color:var(--text);transition:.12s}
.mc-d:hover{background:var(--panel2)}
.mc-d.out{visibility:hidden}
.mc-d.has::after{content:'';position:absolute;bottom:3px;width:4px;height:4px;border-radius:50%;background:var(--accent)}
.mc-d.today{color:var(--accent-ink);font-weight:800;box-shadow:inset 0 0 0 1.5px var(--accent)}
.mc-d.sel{background:var(--accent);color:var(--on-accent);font-weight:800}
.mc-d.sel::after{background:var(--on-accent)}
.brand small{display:block;font-weight:450;color:var(--muted);font-size:11px;letter-spacing:0}
.nav-item{
  display:flex;align-items:center;gap:11px;width:100%;padding:9px 11px;border-radius:var(--r-sm);
  color:var(--muted);font-weight:500;transition:.14s;text-align:left
}
.nav-item .ic{font-size:15px;width:18px;text-align:center}
.nav-item:hover{background:var(--panel2);color:var(--text)}
.nav-item.active{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:20;display:flex;gap:10px;align-items:center;
  padding:14px 26px;background:var(--bg);border-bottom:1px solid var(--line)
}
.search{
  flex:1;max-width:520px;display:flex;align-items:center;gap:8px;
  background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:9px 16px;box-shadow:var(--shadow)
}
.search input{flex:1;border:none;background:none;outline:none;min-width:0}
.search input::placeholder{color:var(--muted)}
.kbd{border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-size:11px;color:var(--muted);background:var(--panel2)}
.sidebar-foot{margin-top:auto;display:flex;gap:8px;align-items:center;padding:10px}
.icon-btn{width:36px;height:36px;border-radius:999px;display:grid;place-items:center;border:1px solid var(--line);background:var(--panel);transition:.14s}
.icon-btn:hover{background:var(--panel2);border-color:var(--muted)}
.view{padding:26px;max-width:940px;width:100%;margin:0 auto;flex:1}
.mobilenav{
  display:none;position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:var(--panel);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))
}
.mobilenav{overflow-x:auto;scrollbar-width:none}
.mobilenav::-webkit-scrollbar{display:none}
.mobilenav button{flex:0 0 62px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px;font-size:9.5px;color:var(--muted);border-radius:10px}
.mobilenav button b{font-size:17px;font-weight:400;line-height:1}
.mobilenav button.active{color:var(--accent-ink);background:var(--accent-soft)}
@media(max-width:860px){
  .app{grid-template-columns:1fr}
  .sidebar{display:none}
  .view{padding:16px 14px 96px}
  .topbar{padding:12px 14px}
  .mobilenav{display:flex}
}
@media(max-width:560px){.hide-sm{display:none}}
.mclock{display:none}
@media(max-width:860px){
  .mclock{display:flex;align-items:baseline;gap:10px;padding:12px 14px 0}
  .mclock span{font-size:12px;color:var(--muted);font-weight:600}
  .mclock span::first-letter{text-transform:uppercase}
  .hoy-date{display:none}
  .mclock b{margin-left:auto;font-size:17px;font-weight:750;letter-spacing:-.6px;font-variant-numeric:tabular-nums;color:var(--accent-ink)}
  .view{padding-top:10px}
}
@media(max-width:380px){
  h1{font-size:25px}
  .tiles{gap:8px}
  .tile{padding:12px 6px}
  .tile .tv{font-size:18px}
  .tile .tl{font-size:9.5px}
  .hero{gap:14px;padding:14px}
  .ring{width:88px;height:88px}
  .wstrip{gap:4px}
  .wday{padding:9px 1px}
  .chip{font-size:11px;padding:1.5px 7px}
  .btn{padding:9px 15px}
}

/* ---------- typography ---------- */
h1{font-size:30px;letter-spacing:-1.1px;margin:0;font-weight:720;line-height:1.15}
h1 .hl{color:var(--accent-ink)}
h2{font-size:17px;letter-spacing:-.3px;margin:0;font-weight:620}
.sub{color:var(--muted);margin:4px 0 0}
.cap::first-letter{text-transform:uppercase}
.dim{color:var(--muted)}
.stats-line{color:var(--muted);font-size:13px;margin-top:8px}
.stats-line b{color:var(--text);font-weight:600}
.section-title{
  display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:700;letter-spacing:.9px;
  text-transform:uppercase;color:var(--muted);margin:26px 0 8px
}
.section-title .count{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:0 7px;font-size:10.5px;letter-spacing:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.empty{color:var(--muted);font-size:13.5px;padding:22px;text-align:center;border:1px dashed var(--line);border-radius:var(--r)}
.head-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.head-row .spacer{flex:1}

/* ---------- quick capture ---------- */
.capture{
  display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--r);padding:13px 16px;box-shadow:var(--shadow);margin-top:20px;transition:.15s
}
.capture:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.capture .plus{color:var(--accent-ink);font-size:18px;line-height:1;display:flex}
.empty-day .svgic{color:var(--accent)}
.capture input{flex:1;border:none;background:none;outline:none;font-size:15px;min-width:0}
.capture input::placeholder{color:var(--muted)}

/* ---------- tasks ---------- */
.tasks{display:flex;flex-direction:column;gap:2px}
.task{display:flex;align-items:flex-start;gap:12px;padding:11px 12px;border-radius:var(--r-sm);transition:background .13s}
.task:hover{background:var(--panel)}
.task.hi{background:var(--hi-soft);box-shadow:inset 3px 0 0 var(--hi)}
.task.focus{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.bullet{
  flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;
  border:1.6px solid var(--low);font-size:12px;line-height:1;color:var(--muted);margin-top:1px;transition:.14s
}
.bullet:hover{border-color:var(--accent);color:var(--accent-ink)}
.bullet.completada{background:var(--ok);border-color:var(--ok);color:var(--on-accent);font-weight:700}
.bullet.migrada{border-color:var(--accent);color:var(--accent-ink)}
.bullet.proceso{border-color:var(--mid);color:var(--mid)}
.task-body{flex:1;min-width:0}
.task-title{font-weight:500;word-break:break-word}
.task.done .task-title{text-decoration:line-through;color:var(--muted)}
.task.done{opacity:.62}
.bang{color:var(--hi);font-weight:800;margin-right:5px}
.task-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--muted);background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:1.5px 8px}
.chip i{width:7px;height:7px;border-radius:50%;display:inline-block;font-style:normal;flex:none}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.dot.alta{background:var(--hi)} .dot.media{background:var(--mid)} .dot.baja{background:var(--low)}
.actions{display:flex;gap:2px;opacity:0;transition:.14s}
.task:hover .actions,.task:focus-within .actions{opacity:1}
.actions button{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;font-size:13px;opacity:.75}
.actions button:hover{background:var(--panel2);opacity:1;box-shadow:inset 0 0 0 1px var(--line)}
@media(max-width:860px){.actions{opacity:1}}

/* ---------- filters ---------- */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:18px}
.pill{padding:5px 12px;border-radius:20px;border:1px solid var(--line);background:var(--panel);font-size:12.5px;color:var(--muted);transition:.14s}
.pill:hover{border-color:var(--muted);color:var(--text)}
.pill.active{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
select.pill{padding:5px 10px;outline:none}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;padding:10px 20px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:13.5px;font-weight:600;transition:.14s;white-space:nowrap}
.btn:hover{background:var(--panel2);border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--hi)}
.btn.danger:hover{border-color:var(--hi)}
.btn.sm{padding:5px 10px;font-size:12.5px}

/* ---------- projects ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;margin-top:18px}
.proj-card{padding:16px;text-align:left;width:100%;display:block;transition:.15s;cursor:pointer}
.proj-card:hover{transform:translateY(-1px);border-color:var(--muted)}
.proj-head{display:flex;align-items:center;gap:9px;font-weight:600}
.proj-head i{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:12px}
.bar > span{display:block;height:100%;background:var(--ok);border-radius:6px;transition:width .3s}
.kanban{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px;align-items:start}
@media(max-width:760px){.kanban{grid-template-columns:1fr}}
.col{padding:12px;min-height:110px}
.col h3{font-size:11.5px;letter-spacing:.9px;text-transform:uppercase;color:var(--muted);margin:2px 4px 10px;font-weight:700}
.kcard{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 11px;margin-bottom:8px;cursor:grab;transition:.13s}
.kcard:active{cursor:grabbing}
.kcard.arrastrando{opacity:.4;border-style:dashed}
.col{transition:.13s}
.col.destino{border-color:var(--accent);background:var(--accent-soft)}
.kcard .kt{font-weight:500;font-size:13.5px;word-break:break-word}
.kcard.done .kt{text-decoration:line-through;color:var(--muted)}
.kcard .krow{display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap}
.mini{font-size:11.5px;padding:2px 8px;border-radius:20px;border:1px solid var(--line);background:var(--panel);color:var(--muted)}
.mini:hover{border-color:var(--accent);color:var(--accent-ink)}
.mini .svgic{width:13px;height:13px;vertical-align:-2px}
.pill .svgic{width:13px;height:13px;vertical-align:-2px;color:inherit}
.search .svgic{color:var(--muted);width:17px;height:17px}

/* ---------- notes ---------- */
.note{padding:16px;display:flex;flex-direction:column;gap:6px}
.note h4{margin:0;font-size:15px;font-weight:600;word-break:break-word}
.note p{margin:0;color:var(--muted);font-size:13.2px;white-space:pre-wrap;word-break:break-word}
.note .foot{display:flex;gap:6px;align-items:center;margin-top:8px;flex-wrap:wrap}
.note time{font-size:11.5px;color:var(--muted);margin-right:auto}

/* ---------- habits ---------- */
.habit{display:flex;align-items:center;gap:14px;padding:14px 16px;flex-wrap:wrap;margin-bottom:12px}
.habit .name{font-weight:550;min-width:120px;display:flex;align-items:center;gap:8px}
.week{display:flex;gap:6px;margin-left:auto}
.day{width:34px;height:38px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:10px;color:var(--muted);transition:.13s}
.day b{font-size:12px;font-weight:600}
.day:hover{border-color:var(--accent)}
.day.on{background:var(--ok);border-color:var(--ok);color:var(--on-accent);font-weight:700}
.day.today{box-shadow:0 0 0 2px var(--accent)}
.score{font-size:12.5px;color:var(--muted);min-width:52px;text-align:right}
/* tarjetas de hábito con horarios */
.hcard{display:flex;align-items:center;gap:14px;padding:14px 16px;margin-bottom:10px}
.hcard.ok{border-color:var(--accent)}
.hicon{width:44px;height:44px;border-radius:14px;background:var(--panel2);border:1px solid var(--line);display:grid;place-items:center;font-size:21px;flex:none}
.hicon.sm{width:26px;height:26px;border-radius:8px;font-size:14px;display:inline-grid;vertical-align:-8px;margin-right:8px}
.hcard.ok .hicon{background:var(--accent);border-color:var(--accent)}
.hname{font-weight:600;font-size:15px}
.hhoras{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.hh{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--muted);background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:4px 11px;transition:.13s}
.hh .svgic{width:13px;height:13px;color:var(--low)}
.hh:hover{border-color:var(--accent)}
.hh.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.hh.on .svgic{color:var(--on-accent)}
.hscore{text-align:right;font-size:11px;color:var(--muted);flex:none}
.hscore b{display:block;font-size:16px;color:var(--text)}
/* tablero semanal */
.tablero{width:100%;border-collapse:collapse;font-size:13px}
.tablero th,.tablero td{padding:7px 5px;text-align:center}
.tablero thead th{font-size:10px;color:var(--muted);font-weight:700;letter-spacing:.4px}
.tablero thead th b{display:block;font-size:13px;color:var(--text);font-weight:700}
.tablero thead th.hoy b{color:var(--accent-ink)}
.tablero tbody th{text-align:left;font-weight:600;white-space:nowrap;padding-right:12px;font-size:13.5px}
.tablero tbody tr+tr th,.tablero tbody tr+tr td{border-top:1px solid var(--line)}
.celda{width:34px;height:34px;border-radius:10px;border:1.5px solid var(--line);background:var(--panel2);display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--muted);transition:.13s;margin:0 auto}
.celda:hover{border-color:var(--accent)}
.celda .svgic{width:16px;height:16px;color:var(--on-accent)}
.celda.on{background:var(--accent);border-color:var(--accent)}
.celda.medio{border-color:var(--accent);color:var(--accent-ink)}
.celda.hoy{box-shadow:0 0 0 2px var(--accent-soft)}
.racha{font-size:14px;font-weight:700;color:var(--accent-ink)}
.racha span{font-size:10px;color:var(--muted);margin-left:1px}
/* selector de iconos */
.iconos{display:flex;flex-wrap:wrap;gap:6px}
.ico{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--panel2);font-size:19px;display:grid;place-items:center;transition:.13s}
.ico:hover{border-color:var(--accent)}
.ico.sel{background:var(--accent);border-color:var(--accent)}
@media(max-width:560px){.week{margin-left:0;width:100%}.day{flex:1}}

<script>
"use strict";
/* =========================================================
   Bullet Journal — vanilla JS, localStorage, single file
   ========================================================= */
const LS_KEY = 'bulletjournal.v1';
const $  = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.prototype.slice.call((r || document).querySelectorAll(s));
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c =>
  ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

/* ---------- fechas ---------- */
const pad = n => String(n).padStart(2, '0');
const key = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const fromKey = k => { const p = String(k).split('-').map(Number); return new Date(p[0], (p[1] || 1) - 1, p[2] || 1); };
const today = () => key(new Date());
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const DIAS  = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const DIAS_C = ['L','M','X','J','V','S','D'];
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const longDate = k => { const d = fromKey(k); return DIAS[d.getDay()] + ' ' + d.getDate() + ' de ' + MESES[d.getMonth()]; };
function shortDate(k){
  if(!k) return 'Sin fecha';
  if(k === today()) return 'Hoy';
  if(k === key(addDays(new Date(), 1))) return 'Mañana';
  if(k === key(addDays(new Date(), -1))) return 'Ayer';
  const d = fromKey(k);
  return d.getDate() + ' ' + MESES[d.getMonth()].slice(0, 3);
}
function startOfWeek(d){ const x = new Date(d); const w = (x.getDay() + 6) % 7; x.setDate(x.getDate() - w); x.setHours(0,0,0,0); return x; }
function weekKeys(offset){
  const s = startOfWeek(addDays(new Date(), (offset || 0) * 7));
  return Array.from({length:7}, (_, i) => key(addDays(s, i)));
}

/* ---------- estado ---------- */
const PRIOS = { alta:{label:'Alta', dot:'🔴'}, media:{label:'Media', dot:'🟡'}, baja:{label:'Baja', dot:'⚪'} };
const COLORS = ['#2563eb','#16a34a','#ef4444','#eab308','#a855f7','#0891b2','#f97316','#64748b'];

/* Arranca vacío: tú creas tus tareas, proyectos, notas y hábitos. */
function seed(){
  return {
    tasks: [],
    projects: [],
    notes: [],
    habits: [],
    deleted: [],
    settings: { theme:'dark', name:'Marco', sound:true, bruce:true, habitHour:20, nudgeEvery:120, lastHabitNudge:'' }
  };
}
function load(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){
      const d = JSON.parse(raw);
      return {
        tasks:    Array.isArray(d.tasks)    ? d.tasks    : [],
        projects: Array.isArray(d.projects) ? d.projects : [],
        notes:    Array.isArray(d.notes)    ? d.notes    : [],
        habits:   Array.isArray(d.habits)   ? d.habits   : [],
        deleted:  Array.isArray(d.deleted)  ? d.deleted  : [],
        settings: Object.assign({ theme:'dark', name:'Marco', sound:true, bruce:true, habitHour:20, nudgeEvery:120, lastHabitNudge:'' }, d.settings || {})
      };
    }
  }catch(e){ console.warn('localStorage ilegible, se reinicia', e); }
  const s = seed();
  try{ localStorage.setItem(LS_KEY, JSON.stringify(s)); }catch(e){}
  return s;
}
let S = load();
function save(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){ toast('No se pudo guardar 😕'); }
  if(typeof syncPronto === 'function') syncPronto();
}

/* marca de tiempo por elemento: permite combinar copias entre dispositivos */
function touch(o){ if(o) o.mtime = Date.now(); return o; }
function tumba(id, tipo){
  S.deleted = (S.deleted || []).filter(t => t.id !== id);
  S.deleted.push({ id, tipo, mtime: Date.now() });
}
function destumba(id){ S.deleted = (S.deleted || []).filter(t => t.id !== id); }

/* estado de interfaz (no persistente salvo tema) */
const ui = { view:'hoy', project:null, filter:'todas', proj:'', q:'', day:null, calMonth:null };
let FOCUS = new Set();   // ids del "foco del día"
let lastAdded = null;    // última tarea capturada (para asignación inline)

/* ---------- helpers de datos ---------- */
const projById  = id => S.projects.find(p => p.id === id) || null;
const taskById  = id => S.tasks.find(t => t.id === id) || null;
const noteById  = id => S.notes.find(n => n.id === id) || null;
const habitById = id => S.habits.find(h => h.id === id) || null;
const isDone    = t => t.status === 'completada';
const byDate    = (a,b) => (a.date || '9999').localeCompare(b.date || '9999') || (a.time || '99:99').localeCompare(b.time || '99:99');

function applyFilters(list){
  let r = list.slice();
  if(ui.filter === 'pendientes')  r = r.filter(t => !isDone(t));
  if(ui.filter === 'completadas') r = r.filter(isDone);
  if(ui.filter === 'alta')        r = r.filter(t => t.priority === 'alta');
  if(ui.proj)                     r = r.filter(t => t.projectId === ui.proj);
  return r;
}
function symbolFor(t){
  if(t.status === 'completada') return '✓';
  if(t.status === 'proceso')    return '›';
  if(t.migrated)                return '→';
  return '';
}

/* ---------- UI utilidades ---------- */
let toastTimer = null;
function toast(msg, actionLabel, fn){
  const el = $('#toast');
  el.innerHTML = '';
  const span = document.createElement('span');
  span.textContent = msg;
  el.appendChild(span);
  if(actionLabel && fn){
    const b = document.createElement('button');
    b.textContent = actionLabel;
    b.addEventListener('click', () => { el.classList.remove('show'); clearTimeout(toastTimer); fn(); });
    el.appendChild(b);
  }
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), actionLabel ? 6500 : 1900);
}
function applyTheme(){
  document.documentElement.setAttribute('data-theme', S.settings.theme);
  const ico = icon(S.settings.theme === 'dark' ? 'sun' : 'moon');
  $('#themeBtn').innerHTML = ico;
  $('#themeBtn2').innerHTML = ico;
}
function toggleTheme(){ S.settings.theme = S.settings.theme === 'dark' ? 'light' : 'dark'; save(); applyTheme(); }

/* ---------- panel lateral: fecha, reloj, mini calendario ---------- */
function tickClock(){
  const n = new Date();
  const hhmm = pad(n.getHours()) + ':' + pad(n.getMinutes());
  const fecha = longDate(key(n));
  const c = $('#sideClock'), d = $('#sideDate');
  if(c) c.innerHTML = hhmm + '<small>' + pad(n.getSeconds()) + '</small>';
  if(d) d.textContent = fecha;
  const mc = $('#mClock'), md = $('#mDate');
  if(mc) mc.textContent = hhmm;
  if(md) md.textContent = fecha;
}
function miniCalHTML(){
  const ref  = fromKey((ui.calMonth || today().slice(0,7)) + '-01');
  const y = ref.getFullYear(), m = ref.getMonth();
  const off  = (new Date(y, m, 1).getDay() + 6) % 7;
  const dias = new Date(y, m + 1, 0).getDate();
  const sel  = ui.day || today();
  let cells = '';
  for(let i = 0; i < off; i++) cells += '<span class="mc-d out"></span>';
  for(let d = 1; d <= dias; d++){
    const k = y + '-' + pad(m + 1) + '-' + pad(d);
    const n = S.tasks.filter(t => t.date === k && !isDone(t)).length;
    cells += `<button class="mc-d ${k===today()?'today':''} ${k===sel?'sel':''} ${n?'has':''}" data-act="go-day" data-k="${k}"
      aria-label="${esc(longDate(k))}${n?', '+n+' pendientes':''}">${d}</button>`;
  }
  return `<div class="mc-head">
      <div class="mc-title">${MESES[m]} ${y}</div>
      <button class="mc-nav" data-act="cal" data-d="-1" aria-label="Mes anterior">${icon('left')}</button>
      <button class="mc-nav" data-act="cal" data-d="1" aria-label="Mes siguiente">${icon('right')}</button>
    </div>
    <div class="mc-grid">${DIAS_C.map(d => '<small>' + d + '</small>').join('')}${cells}</div>`;
}
function renderSide(){
  const mc = $('#minical'); if(mc) mc.innerHTML = miniCalHTML();
  tickClock();
}

  const foco = FOCUS.has(t.id);
  const alta = t.priority === 'alta' && !isDone(t);
  const cls = (isDone(t) ? 'done ' : '') + (foco ? 'focus ' : (alta ? 'hi ' : ''));
  const n = esc(t.title);
  return `<div class="task ${cls}">
    <button class="bullet ${t.status}${t.migrated && !isDone(t) ? ' migrada':''}" data-act="toggle" data-id="${t.id}"
            aria-pressed="${isDone(t)}" aria-label="${isDone(t)?'Marcar como pendiente':'Completar'}: ${n}" title="Cambiar estado">${symbolFor(t)}</button>
    <div class="task-body">
      <div class="task-title">${alta ? '<span class="bang">!</span>':''}${n}</div>
      <div class="task-meta">
        ${foco ? `<span class="chip">${icon('target')} Foco</span>` : ''}
        ${t.time ? `<span class="chip">${icon('clock')} ${esc(t.time)}</span>` : ''}
        <span class="chip">${icon('calendar')} ${esc(shortDate(t.date))}</span>
        ${p ? `<span class="chip"><i style="background:${esc(p.color)}"></i>${esc(p.name)}</span>` : ''}
        <span class="chip"><span class="dot ${t.priority}"></span>${pr.label}</span>
        ${t.subtasks && t.subtasks.length ? `<span class="chip">${icon('check')} ${t.subtasks.filter(s=>s.done).length}/${t.subtasks.length}</span>` : ''}
        ${t.remind ? `<span class="chip">${icon('bell')} ${t.remind}m</span>` : ''}
        ${t.status==='proceso' ? `<span class="chip">${icon('clock')} En proceso</span>` : ''}
        ${t.note ? `<span class="chip">• ${esc(t.note.length>48 ? t.note.slice(0,48)+'…' : t.note)}</span>` : ''}
      </div>
    </div>
    <div class="actions">
      <button data-act="edit-task"  data-id="${t.id}" aria-label="Editar ${n}"             title="Editar">${icon('edit')}</button>
      <button data-act="date-task"  data-id="${t.id}" aria-label="Cambiar fecha de ${n}"   title="Cambiar fecha">${icon('calendar')}</button>

function renderProximos(){
  const t0 = new Date(), d0 = today(), d1 = key(addDays(t0,1));
  const thisW = weekKeys(0), nextW = weekKeys(1);
  const list = applyFilters(S.tasks.filter(t => t.date && t.date >= d0)).sort(byDate);

  const buckets = [
    { title:'Hoy',           keys:[d0] },
    { title:'Mañana',        keys:[d1] },
    { title:'Esta semana',   keys:thisW.filter(k => k > d1 && k >= d0) },
    { title:'Próxima semana',keys:nextW },
    { title:'Más adelante',  keys:null }
  ];
  const usadas = new Set([d0, d1].concat(thisW, nextW));

  const html = buckets.map(b => {
    const keys = b.keys ? b.keys.slice() : Array.from(new Set(list.map(t => t.date).filter(k => !usadas.has(k)))).sort();
    const inside = keys.map(k => {
      const day = list.filter(t => t.date === k);
      if(!day.length) return '';
      return `<h2 style="margin:16px 0 6px;font-size:14.5px" class="cap">${longDate(k)}</h2>${taskList(day)}`;
    }).join('');
    if(!inside) return '';
    return `<div class="section-title">${b.title}</div>${inside}`;
  }).join('');

  return `<h1>Próximos</h1><p class="sub">Todo lo que viene, ordenado por fecha.</p>
    ${filterBar()}
    ${html || '<div class="empty" style="margin-top:20px">Sin tareas próximas.</div>'}`;
}

function projStats(id){
  const ts = S.tasks.filter(t => t.projectId === id);
  const done = ts.filter(isDone).length;
  return { total:ts.length, done, pend:ts.length - done, pct: ts.length ? Math.round(done/ts.length*100) : 0 };
}

function fmtStamp(iso){
  if(!iso) return '';
  const d = new Date(iso);
  if(isNaN(d)) return '';
  return d.getDate() + ' ' + MESES[d.getMonth()].slice(0,3) + ' ' + d.getFullYear();
}

/* ---------- hábitos con horarios ---------- */
function habHoras(h){ return Array.isArray(h.times) && h.times.length ? h.times : []; }
function habTotal(h){ return Math.max(1, habHoras(h).length); }
function habHechos(h, k){
  const v = h.log && h.log[k];
  if(!v) return 0;
  if(v === true) return habTotal(h);              /* formato antiguo */
  return habHoras(h).filter(t => v[t]).length || (v.__ ? 1 : 0);
}
function habListo(h, k){ return habHechos(h, k) >= habTotal(h); }
function habRacha(h){
  let n = 0, d = new Date();
  while(n < 400){
    const k = key(d);
    if(habListo(h, k)) n++;
    else if(k !== today()) break;                 /* hoy sin marcar no corta la racha */
    else { d = addDays(d, -1); continue; }
    d = addDays(d, -1);
  }
  return n;
}
function marcarHabito(id, k, hora){
  const h = habitById(id); if(!h) return;
  h.log = h.log || {};
  let v = h.log[k];
  if(v === true){ v = {}; habHoras(h).forEach(t => v[t] = true); if(!habHoras(h).length) v.__ = true; }
  if(!v || typeof v !== 'object') v = {};
  if(hora){
    if(v[hora]) delete v[hora]; else v[hora] = true;
  }else if(habHoras(h).length){
    const todo = habListo(h, k);
    v = {}; if(!todo) habHoras(h).forEach(t => v[t] = true);
  }else{
    v = v.__ ? {} : { __:true };
  }
  if(Object.keys(v).length) h.log[k] = v; else delete h.log[k];
  touch(h); save(); render();
}
function renderHabitos(){
  const wk = weekKeys(0), d0 = today();
  const hoyPend = S.habits.filter(h => !habListo(h, d0)).length;

  const tarjetaHoy = h => {
    const horas = habHoras(h), hechos = habHechos(h, d0), total = habTotal(h);
    return `<div class="card hcard ${habListo(h,d0)?'ok':''}">
      <div class="hicon">${esc(h.icon || '🔄')}</div>

          ${horas.length
            ? horas.map(t => `<button class="hh ${(h.log&&h.log[d0]&&h.log[d0]!==true&&h.log[d0][t])||h.log&&h.log[d0]===true?'on':''}"
                data-act="habit-hora" data-id="${h.id}" data-k="${d0}" data-h="${t}"
                aria-label="Marcar ${esc(h.name)} de las ${t}">${icon('check')} ${t}</button>`).join('')
            : `<button class="hh ${habListo(h,d0)?'on':''}" data-act="habit-day" data-id="${h.id}" data-k="${d0}">${icon('check')} Marcar hoy</button>`}
        </div>
      </div>
      <div class="hscore"><b>${hechos}/${total}</b><span>hoy</span></div>
      <div class="actions" style="opacity:1">
        <button data-act="edit-habit" data-id="${h.id}" aria-label="Editar ${esc(h.name)}">${icon('edit')}</button>
        <button data-act="del-habit"  data-id="${h.id}" aria-label="Eliminar ${esc(h.name)}">${icon('trash')}</button>

  };

  const fila = h => `<tr>
      <th scope="row"><span class="hicon sm">${esc(h.icon || '🔄')}</span><span>${esc(h.name)}</span></th>
      ${wk.map(k => {
        const hechos = habHechos(h, k), total = habTotal(h), estado = hechos >= total ? 'on' : (hechos ? 'medio' : '');
        return `<td><button class="celda ${estado} ${k===d0?'hoy':''}" data-act="habit-day" data-id="${h.id}" data-k="${k}"
          aria-label="${esc(h.name)}, ${esc(longDate(k))}: ${hechos} de ${total}">
          ${hechos >= total ? icon('check') : (hechos ? hechos + '/' + total : '')}</button></td>`;
      }).join('')}
      <td class="racha">${habRacha(h)}<span>d</span></td>
    </tr>`;

  return `
  <div class="head-row"><h1>Hábitos</h1><div class="spacer"></div>
    <button class="btn primary" data-act="new-habit">+ Nuevo hábito</button></div>
  <p class="sub">${S.habits.length ? (hoyPend ? `Te faltan ${hoyPend} de ${S.habits.length} hoy.` : 'Todos los de hoy están marcados.') : 'Crea el primero y ponle horarios.'}</p>

  ${S.habits.length ? `
    <div class="section-title">Hoy</div>

    <div class="section-title">Tablero de la semana</div>
    <div class="card" style="overflow-x:auto">
      <table class="tablero">
        <thead><tr><th></th>${wk.map((k,i) => `<th class="${k===d0?'hoy':''}"><span>${DIAS_C[i]}</span><b>${fromKey(k).getDate()}</b></th>`).join('')}<th>racha</th></tr></thead>

  ` : `<div class="card empty-day">

function renderResumen(){
  const d0 = today();
  const hoy = S.tasks.filter(t => t.date === d0);
  const comp = hoy.filter(isDone).length;
  const activos = S.projects.filter(p => S.tasks.some(t => t.projectId === p.id && !isDone(t))).length;
  const wk = weekKeys(0);
  const counts = wk.map(k => S.tasks.filter(t => isDone(t) && (t.completedAt || t.date) === k).length);
  const max = Math.max.apply(null, counts.concat([1]));
  const prev = weekKeys(-1).map(k => S.tasks.filter(t => isDone(t) && (t.completedAt || t.date) === k).length);
  const totW = counts.reduce((a,b) => a+b, 0), totP = prev.reduce((a,b) => a+b, 0);
  const diff = totW - totP;
  const deltaTxt = diff === 0 ? 'igual que la semana pasada' : (diff > 0 ? '+' + diff : diff) + ' vs semana pasada';
  const deltaCol = diff > 0 ? 'var(--ok)' : (diff < 0 ? 'var(--hi)' : 'var(--muted)');

  return `
  <h1>Resumen</h1><p class="sub">Cómo va tu semana.</p>
  <div class="cards4">
    <div class="card stat"><div class="k">Tareas hoy</div><div class="v">${hoy.length}</div></div>
    <div class="card stat"><div class="k">Completadas</div><div class="v" style="color:var(--ok)">${comp}</div>
      <div class="k" style="margin-top:6px;color:${deltaCol}">${deltaTxt}</div></div>
    <div class="card stat"><div class="k">Pendientes</div><div class="v">${hoy.length - comp}</div></div>
    <div class="card stat"><div class="k">Proyectos activos</div><div class="v">${activos}</div></div>
  </div>

  <div class="section-title">Productividad de la semana</div>
  <div class="card">
    <div class="chart">
      ${wk.map((k,i) => `<div class="col2">
        <div class="vv">${counts[i]}</div>
        <div class="barwrap"><div class="b ${counts[i]?'':'zero'}" style="height:${Math.round(counts[i]/max*100)}%"></div></div>
        <div class="lb">${DIAS_C[i]}</div>
      </div>`).join('')}
    </div>
  </div>
  <p class="stats-line">Esta semana: <b>${totW}</b> completadas · semana pasada: <b>${totP}</b> · <span style="color:${deltaCol}">${deltaTxt}</span></p>

  <div class="section-title">Reparto por proyecto</div>
  ${donutHTML()}`;
}

/* distribución por proyecto (donut sin librerías) */
function donutHTML(){
  const data = S.projects.map(p => ({ name:p.name, color:p.color, n:S.tasks.filter(t => t.projectId === p.id).length })).filter(d => d.n);
  const sin = S.tasks.filter(t => !t.projectId).length;
  if(sin) data.push({ name:'Sin proyecto', color:'var(--low)', n:sin });
  const tot = data.reduce((a,b) => a + b.n, 0);
  if(!tot) return '<div class="empty">Aún no hay tareas para repartir.</div>';
  let acc = 0;
  const segs = data.map(d => { const from = acc / tot * 360; acc += d.n; return `${d.color} ${from}deg ${acc / tot * 360}deg`; }).join(', ');
  return `<div class="card donut-wrap">
    <div class="donut" style="background:conic-gradient(${segs})" role="img" aria-label="Reparto de tareas por proyecto">

/* Captura en lenguaje natural:
   "Enviar reporte mañana 9:30 !alta #RedBull" -> fecha, hora, prioridad y proyecto */
function parseQuick(raw){
  let s = ' ' + String(raw).trim() + ' ';
  const out = { title:'', date:today(), time:'', projectId:'', priority:'media' };
  const t = new Date();

  const pm = s.match(/\s!(alta|media|baja|a|m|b)\b/i);
  if(pm){
    const v = pm[1].toLowerCase()[0];
    out.priority = v === 'a' ? 'alta' : (v === 'b' ? 'baja' : 'media');
    s = s.replace(pm[0], ' ');
  }else if(/\s!!/.test(s)){ out.priority = 'alta'; s = s.replace(/\s!!/, ' '); }

  const gm = s.match(/\s#([0-9A-Za-zÁÉÍÓÚÑÜáéíóúñü_-]+)/);
  if(gm){
    const needle = gm[1].toLowerCase().replace(/[\s_-]/g, '');
    const p = S.projects.find(x => x.name.toLowerCase().replace(/\s/g, '').indexOf(needle) === 0)
           || S.projects.find(x => x.name.toLowerCase().replace(/\s/g, '').includes(needle));
    if(p){ out.projectId = p.id; s = s.replace(gm[0], ' '); }
  }

  const hm = s.match(/\s(?:a\s+las\s+)?([01]?\d|2[0-3]):([0-5]\d)\b/);
  if(hm){ out.time = pad(Number(hm[1])) + ':' + hm[2]; s = s.replace(hm[0], ' '); }

  let ok = false;
  const rel = [[/\bpasado\s+ma[ñn]ana\b/i, 2], [/\bma[ñn]ana\b/i, 1], [/\bhoy\b/i, 0]];
  for(let i = 0; i < rel.length && !ok; i++){
    if(rel[i][0].test(s)){ out.date = key(addDays(t, rel[i][1])); s = s.replace(rel[i][0], ' '); ok = true; }
  }
  if(!ok){
    const dm = s.match(/\ben\s+(\d{1,2})\s+d[ií]as?\b/i);
    if(dm){ out.date = key(addDays(t, Number(dm[1]))); s = s.replace(dm[0], ' '); ok = true; }
  }
  if(!ok){
    const wd = ['domingo','lunes','martes','mi[ée]rcoles','jueves','viernes','s[áa]bado'];
    for(let i = 0; i < 7 && !ok; i++){
      const re = new RegExp('\\b(?:el\\s+)?' + wd[i] + '\\b', 'i');
      if(re.test(s)){
        let diff = (i - t.getDay() + 7) % 7; if(diff === 0) diff = 7;
        out.date = key(addDays(t, diff)); s = s.replace(re, ' '); ok = true;
      }
    }
  }
  if(!ok){
    const fm = s.match(/\b(\d{1,2})[\/-](\d{1,2})(?:[\/-](\d{2,4}))?\b/);
    if(fm){
      const y = fm[3] ? (Number(fm[3]) < 100 ? 2000 + Number(fm[3]) : Number(fm[3])) : t.getFullYear();
      const d = new Date(y, Number(fm[2]) - 1, Number(fm[1]));
      if(!isNaN(d.getTime())){
        if(!fm[3] && key(d) < today()) d.setFullYear(y + 1);
        out.date = key(d); s = s.replace(fm[0], ' ');
      }
    }
  }
  out.title = s.replace(/\s+/g, ' ').trim();
  return out;
}

/* combina dos copias: gana el elemento con marca de tiempo más nueva */
function fusionar(d){
  const tumbas = {};
  (S.deleted || []).concat(d.deleted || []).forEach(t => {
    if(!tumbas[t.id] || t.mtime > tumbas[t.id]) tumbas[t.id] = t.mtime;
  });
  const res = {};
  ['tasks','projects','notes','habits'].forEach(k => {
    const mapa = new Map();
    (S[k] || []).forEach(x => mapa.set(x.id, x));
    (d[k] || []).forEach(x => {
      const cur = mapa.get(x.id);
      if(!cur){ mapa.set(x.id, x); return; }
      const gana = (x.mtime || 0) > (cur.mtime || 0) ? x : cur;
      if(k === 'habits') gana.log = Object.assign({}, cur.log || {}, x.log || {});
      mapa.set(x.id, gana);
    });
    res[k] = Array.from(mapa.values()).filter(x => !(tumbas[x.id] && tumbas[x.id] > (x.mtime || 0)));
  });
  const corte = Date.now() - 90 * 86400000;
  res.deleted = Object.keys(tumbas).filter(id => tumbas[id] > corte).map(id => ({ id, mtime:tumbas[id] }));
  res.settings = S.settings;
  return res;
}

    const aplicar = (modo) => {
      S = modo === 'combinar' ? fusionar(d) : {

        deleted:d.deleted || [], settings: Object.assign({}, S.settings, { name:(d.settings||{}).name || S.settings.name })
      };
      save(); applyTheme(); closeModal(); render();
      toast((modo === 'combinar' ? 'Copias combinadas · ' : 'Copia importada · ') + S.tasks.length + ' tareas', 'Deshacer',
        () => { S = prev; save(); applyTheme(); render(); });
    };
    if(vacio){ aplicar('reemplazar'); return; }
    openModal(`<div class="modal-h"><h3>Ya tienes datos aquí</h3>
        <button type="button" class="icon-btn" data-act="close" aria-label="Cerrar">${icon('x')}</button></div>

}

/* compartir la copia (en el celular abre WhatsApp, Drive, correo...) */
async function compartirCopia(){
  const json = JSON.stringify(S, null, 2);
  const nombre = 'taskflow-' + today() + '.json';
  try{
    const f = new File([json], nombre, { type:'application/json' });
    if(navigator.canShare && navigator.canShare({ files:[f] })){
      await navigator.share({ files:[f], title:'Copia de TaskFlow' });
      S.settings.lastExport = today(); save(); render();
      toast('Copia compartida');
      return;
    }
  }catch(e){ if(e && e.name === 'AbortError') return; }
  exportData();
}
function resetData(){
  toast('¿Borrar TODO y empezar de cero?', 'Sí, borrar', () => {
    const prev = JSON.parse(JSON.stringify(S));
    S = seed(); save(); applyTheme(); render();
    toast('Datos reiniciados', 'Deshacer', () => { S = prev; save(); applyTheme(); render(); });
  });
}
function nameModal(){
  openModal(modalShell('Tu nombre', `
    <div class="field"><label>¿Cómo te llamamos?</label><input name="name" value="${esc(S.settings.name)}" required></div>`),
  (data) => {
    if(!data.name.trim()) return;
    S.settings.name = data.name.trim(); save(); closeModal(); render(); toast('Listo, ' + S.settings.name);
  });
}

/* ---- alarma sonora (Web Audio, sin archivos) ---- */
let audioCtx = null, audioListo = false;
function unlockAudio(){
  if(audioListo) return;
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    audioCtx = audioCtx || new AC();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    audioListo = true;
    cargarLadrido();
  }catch(e){}
}
/* ---- ladridos sintetizados (sin archivos de audio) ---- */
let ruidoBuf = null;
function bufferRuido(){
  if(ruidoBuf) return ruidoBuf;
  const n = Math.floor(audioCtx.sampleRate * 0.35);
  ruidoBuf = audioCtx.createBuffer(1, n, audioCtx.sampleRate);
  const d = ruidoBuf.getChannelData(0);
  for(let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  return ruidoBuf;
}
function guau(t0, f0, f1, dur, vol){
  /* parte tonal: caída rápida de tono = "wof" */
  const o = audioCtx.createOscillator(), bp = audioCtx.createBiquadFilter(), g = audioCtx.createGain();
  o.type = 'sawtooth';
  o.frequency.setValueAtTime(f0, t0);
  o.frequency.exponentialRampToValueAtTime(f1, t0 + dur * 0.75);
  bp.type = 'bandpass'; bp.Q.value = 1.1;
  bp.frequency.setValueAtTime(1500, t0);
  bp.frequency.exponentialRampToValueAtTime(420, t0 + dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + 0.014);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(bp); bp.connect(g); g.connect(audioCtx.destination);
  o.start(t0); o.stop(t0 + dur + 0.03);
  /* transitorio de aire: el "ch" inicial del ladrido */
  const s = audioCtx.createBufferSource(), hp = audioCtx.createBiquadFilter(), ng = audioCtx.createGain();
  s.buffer = bufferRuido();
  hp.type = 'bandpass'; hp.frequency.value = 1900; hp.Q.value = 0.7;
  ng.gain.setValueAtTime(0.0001, t0);
  ng.gain.exponentialRampToValueAtTime(vol * 0.6, t0 + 0.008);
  ng.gain.exponentialRampToValueAtTime(0.0001, t0 + dur * 0.55);
  s.connect(hp); hp.connect(ng); ng.connect(audioCtx.destination);
  s.start(t0); s.stop(t0 + dur);
}
/* ladrido sintético: solo se usa si el audio real aún no está listo */
function ladridoSint(tipo){
  const t = audioCtx.currentTime + 0.02;
  if(tipo === 'aviso'){
    guau(t, 330, 115, 0.22, 0.30); guau(t + 0.30, 315, 110, 0.20, 0.28); guau(t + 0.58, 300, 100, 0.28, 0.30);
  }else{
    guau(t, 500, 200, 0.15, 0.24); guau(t + 0.21, 440, 175, 0.13, 0.20);
  }
}

let barkBuf = null, barkCargando = false;
function cargarLadrido(){
  if(barkBuf || barkCargando || !audioCtx || BARK_MP3.length < 100) return;
  barkCargando = true;
  try{
    const bin = atob(BARK_MP3);
    const arr = new Uint8Array(bin.length);
    for(let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    audioCtx.decodeAudioData(arr.buffer, b => { barkBuf = b; }, () => { barkCargando = false; });
  }catch(e){ barkCargando = false; }
}
/* el mp3 trae 0.06 s de silencio al inicio y ~0.3 s al final: se recortan */
const BARK_IN = 0.045, BARK_LEN = 0.30;
function sonarLadrido(t0, rate, vol){
  const s = audioCtx.createBufferSource(), g = audioCtx.createGain();
  s.buffer = barkBuf;
  s.playbackRate.value = rate;
  g.gain.value = vol;
  s.connect(g); g.connect(audioCtx.destination);
  s.start(t0, BARK_IN, BARK_LEN);
}
function ladrido(tipo){
  if(S.settings.sound === false) return;
  try{
    unlockAudio();
    if(!audioCtx) return;
    cargarLadrido();
    if(barkBuf){
      const t = audioCtx.currentTime + 0.02;
      if(tipo === 'aviso'){
        /* aviso: tres ladridos graves e insistentes */
        sonarLadrido(t,        0.86, 1.0);
        sonarLadrido(t + 0.34, 0.81, 0.95);
        sonarLadrido(t + 0.70, 0.77, 1.0);
      }else{
        /* saludo: dos ladridos cortos y alegres */
        sonarLadrido(t,        1.18, 0.85);
        sonarLadrido(t + 0.25, 1.28, 0.62);
      }
    }else{
      ladridoSint(tipo);
    }
    const b = $('#bruceBtn');
    if(b){ b.classList.remove('ladra'); void b.offsetWidth; b.classList.add('ladra'); }
  }catch(e){}
}
function alarma(veces){
  if(S.settings.sound === false) return;
  try{
    unlockAudio();
    if(!audioCtx) return;
    const n = veces || 3, t0 = audioCtx.currentTime;
    for(let i = 0; i < n; i++){
      const o = audioCtx.createOscillator(), g = audioCtx.createGain(), at = t0 + i * 0.3;
      o.type = 'sine';
      o.frequency.setValueAtTime(i % 2 ? 660 : 880, at);
      g.gain.setValueAtTime(0.0001, at);
      g.gain.exponentialRampToValueAtTime(0.28, at + 0.03);
      g.gain.exponentialRampToValueAtTime(0.0001, at + 0.26);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(at); o.stop(at + 0.28);
    }
  }catch(e){}
}

function bruceResponde(qRaw){
  const q = norm(qRaw);
  if(!q) return '¿Me repites?';
  if(/^(nueva|crea|crear|agrega|agregar|anota) /.test(q)){
    const txt = qRaw.replace(/^\s*\S+\s+/, '');
    quickAdd(txt);
    return `Anotada: "${txt}". La ves en Hoy.`;
  }
  if(/(hola|hey|buenas|bruce)/.test(q) && q.length < 22) return `${saludo()}, ${S.settings.name}. ¿Reviso tu día?`;
  if(/(gracias|genial|bien)/.test(q)) return '¡Para eso estoy! 🐾';
  if(/(ayuda|puedes|comandos|\?)/.test(q) && q.length < 30)
    return 'Puedo con:\n· "hoy" — resumen del día\n· "hábitos"\n· "atrasadas"\n· "semana"\n· "proyectos"\n· "notas"\n· "nueva Llamar a proveedor" — crea la tarea';
  if(/(habito|habitos)/.test(q)){
    if(!S.habits.length) return 'Aún no tienes hábitos. Créalos en la sección Hábitos.';
    const hb = habitosPendientes(), wk = weekKeys(0);
    const detalle = S.habits.map(h => {
      const dias = wk.filter(k => habListo(h, k)).length;
      const horas = habHoras(h).length ? ' · ' + habHoras(h).join(' ') : '';
      return `· ${h.icon || ''} ${h.name}: ${dias}/7 esta semana${horas}`;
    }).join('\n');
    return (hb.length ? `Te faltan hoy: ${hb.map(h => h.name).join(', ')}.\n` : 'Hoy los marcaste todos. 🐾\n') + detalle;
  }
  if(/(atrasad|vencid|retras)/.test(q)){
    const a = atrasadas();
    if(!a.length) return 'Nada atrasado. Vas al día.';
    return `${a.length} atrasada${a.length===1?'':'s'}:\n` + a.slice(0,6).map(t => `· ${t.title} (${shortDate(t.date)})`).join('\n') +
           '\nDime "mover" y las paso todas a hoy.';
  }
  if(/^mover/.test(q)){ const n = atrasadas().length; bulkToHoy(); return n ? `Listo, ${n} tareas movidas a hoy.` : 'No había nada atrasado.'; }
  if(/(semana|resumen|productiv)/.test(q)){
    const wk = weekKeys(0), prev = weekKeys(-1);
    const c = wk.reduce((a,k) => a + S.tasks.filter(t => isDone(t) && (t.completedAt||t.date) === k).length, 0);
    const p = prev.reduce((a,k) => a + S.tasks.filter(t => isDone(t) && (t.completedAt||t.date) === k).length, 0);
    const d = c - p;
    return `Esta semana llevas ${c} completadas (${d===0?'igual que':(d>0?'+'+d+' vs':d+' vs')} la semana pasada).\nPor delante: ${S.tasks.filter(t => !isDone(t) && t.date >= today()).length} tareas.`;
  }
  if(/(proyecto)/.test(q)){
    if(!S.projects.length) return 'No hay proyectos todavía.';
    return 'Por proyecto:\n' + S.projects.map(p => { const s = projStats(p.id); return `· ${p.name}: ${s.pend} pendientes / ${s.done} listas`; }).join('\n');
  }
  if(/(nota)/.test(q)){
    if(!S.notes.length) return 'No tienes notas guardadas.';
    return `Tienes ${S.notes.length} nota${S.notes.length===1?'':'s'}. La última: "${S.notes[S.notes.length-1].title || 'sin título'}".`;
  }
  if(/(manana|proximo|proxima|viene)/.test(q)){
    const k = key(addDays(new Date(), 1));
    const m = S.tasks.filter(t => t.date === k && !isDone(t));
    return m.length ? `Mañana tienes ${m.length}:\n` + m.map(t => `· ${t.title}${t.time?' ('+t.time+')':''}`).join('\n') : 'Mañana lo tienes libre.';
  }
  if(/(hoy|toca|plan|dia|pendiente|tarea)/.test(q)){
    const pend = tareasHoy().filter(t => !isDone(t));
    return briefing() + (pend.length ? '\n\n' + pend.slice(0,6).map(t => `· ${t.title}${t.time?' ('+t.time+')':''}`).join('\n') : '');
  }
  return 'No te seguí. Prueba con "hoy", "hábitos", "atrasadas", "semana" o "nueva <tarea>".';
}

/* ---- dictado por voz (Web Speech API del navegador) ---- */
const VozOK = !!(window.SpeechRecognition || window.webkitSpeechRecognition);
let reco = null, escuchando = false, destinoVoz = 'bruce';
function pintarMic(activo){
  $$('[data-act="mic"]').forEach(b => b.classList.toggle('escuchando', !!activo));
}
function dictar(destino){
  if(!VozOK){ toast('Tu navegador no permite dictado'); return; }
  destinoVoz = destino || 'bruce';
  if(escuchando){ try{ reco.stop(); }catch(e){} return; }
  try{
    const R = window.SpeechRecognition || window.webkitSpeechRecognition;
    reco = new R();
    reco.lang = 'es-CL';
    reco.interimResults = true;
    reco.continuous = false;
    reco.maxAlternatives = 1;
    let texto = '';
    reco.onstart = () => { escuchando = true; pintarMic(true); toast('Te escucho...'); };
    reco.onresult = ev => {
      texto = '';
      for(let i = 0; i < ev.results.length; i++) texto += ev.results[i][0].transcript;
      const caja = destinoVoz === 'captura' ? $('#captureInput') : $('#bruceInput');
      if(caja) caja.value = texto;
    };
    reco.onerror = ev => {
      escuchando = false; pintarMic(false);
      if(ev.error === 'not-allowed') toast('Falta permiso del micrófono');
      else if(ev.error === 'no-speech') toast('No te escuché nada');
      else toast('No pude usar el micrófono');
    };
    reco.onend = () => {
      escuchando = false; pintarMic(false);
      const t = (texto || '').trim();
      if(!t) return;
      if(destinoVoz === 'captura'){
        const caja = $('#captureInput'); if(caja) caja.value = '';
        quickAdd(t);
      }else{
        const caja = $('#bruceInput'); if(caja) caja.value = '';
        /* si no es una pregunta conocida, lo tomo como tarea nueva */
        const esPregunta = /^(hoy|habito|habitos|hábitos|atrasad|semana|proyecto|nota|manana|mañana|ayuda|hola|mover|gracias)/i.test(t);
        if(esPregunta) preguntarBruce(t);
        else { quickAdd(t); bruceLog.push({ who:'me', text:'🎤 ' + t });
               bruceLog.push({ who:'bruce', text:`Anotada: "${parseQuick(t).title}". ¿Algo más?` });
               abrirBruce(); renderBruce(); }
      }
    };
    reco.start();
  }catch(e){ toast('No pude iniciar el micrófono'); escuchando = false; pintarMic(false); }
}

/* ---- Google Drive (carpeta privada de la app: no ve tus otros archivos) ---- */
let gisToken = null, gisExp = 0;
function cargarGIS(){
  if(window.google && window.google.accounts && google.accounts.oauth2) return Promise.resolve();
  return new Promise((ok, err) => {
    const s = document.createElement('script');
    s.src = 'https://accounts.google.com/gsi/client';
    s.async = true; s.defer = true;
    s.onload = ok; s.onerror = () => err(new Error('no cargó Google'));
    document.head.appendChild(s);
  });
}
async function driveToken(interactivo){
  if(gisToken && Date.now() < gisExp - 60000) return gisToken;
  await cargarGIS();
  const cid = (NUBE().clientId || '').trim();
  if(!cid) throw new Error('falta el ID de cliente');
  return new Promise((ok, err) => {
    let listo = false;
    const cli = google.accounts.oauth2.initTokenClient({
      client_id: cid,
      scope: 'https://www.googleapis.com/auth/drive.appdata',
      prompt: interactivo ? 'consent' : '',
      callback: r => {
        listo = true;
        if(r && r.access_token){
          gisToken = r.access_token;
          gisExp = Date.now() + (Number(r.expires_in) || 3600) * 1000;
          ok(gisToken);
        }else err(new Error('sin permiso'));
      },
      error_callback: e => { listo = true; err(new Error((e && e.type) || 'permiso denegado')); }
    });
    cli.requestAccessToken();
    setTimeout(() => { if(!listo) err(new Error('sesión de Google no iniciada')); }, 45000);
  });
}

  const cuerpo =
    '--' + lim + '\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n' + JSON.stringify(meta) +
    '\r\n--' + lim + '\r\nContent-Type: application/json\r\n\r\n' + JSON.stringify(datos) +
    '\r\n--' + lim + '--';
  const url = id
    ? 'https://www.googleapis.com/upload/drive/v3/files/' + id + '?uploadType=multipart'
    : 'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart';
  const r = await fetch(url, {
    method: id ? 'PATCH' : 'POST',
    headers:{ Authorization:'Bearer ' + tok, 'Content-Type':'multipart/related; boundary=' + lim },
    body: cuerpo
  });
  if(!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}
async function syncDrive(silencio){
  const tok = await driveToken(!silencio && !gisToken);
  const f = await driveBuscar(tok);
  if(f){
    try{
      const remoto = await driveLeer(tok, f.id);
      if(remoto && Array.isArray(remoto.tasks)){
        const ajustes = S.settings;
        S = fusionar(remoto);
        S.settings = ajustes;
      }
    }catch(e){}
  }
  await driveGuardar(tok, f && f.id, {
    tasks:S.tasks, projects:S.projects, notes:S.notes, habits:S.habits,
    deleted:S.deleted || [], guardado:new Date().toISOString()
  });
}
async function claveDe(pass, salt){
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name:'PBKDF2', salt:enc.encode(salt), iterations:120000, hash:'SHA-256' },
    base, { name:'AES-GCM', length:256 }, false, ['encrypt','decrypt']);
}
async function idDe(pass){
  const h = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('taskflow:' + pass));
  return Array.from(new Uint8Array(h)).slice(0, 16).map(b => b.toString(16).padStart(2,'0')).join('');
}
const b64 = u8 => btoa(String.fromCharCode.apply(null, u8));
const deB64 = s => new Uint8Array(atob(s).split('').map(c => c.charCodeAt(0)));
async function cifrar(obj, pass){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const k = await claveDe(pass, 'taskflow-sal');
  const data = new TextEncoder().encode(JSON.stringify(obj));
  const out = new Uint8Array(await crypto.subtle.encrypt({ name:'AES-GCM', iv }, k, data));
  return b64(iv) + '.' + b64(out);
}
async function descifrar(txt, pass){
  const [a, b] = String(txt).split('.');
  const k = await claveDe(pass, 'taskflow-sal');
  const out = await crypto.subtle.decrypt({ name:'AES-GCM', iv:deB64(a) }, k, deB64(b));
  return JSON.parse(new TextDecoder().decode(out));
}
function nubeHeaders(){
  const n = NUBE();
  return { apikey:n.key, Authorization:'Bearer ' + n.key, 'Content-Type':'application/json', Prefer:'resolution=merge-duplicates' };
}
let sincronizando = false, tSync = null;
async function sincronizar(silencio){
  if(!nubeLista() || sincronizando || !navigator.onLine) return;
  sincronizando = true;
  pintarNube('sync');
  try{
    if(NUBE().tipo === 'drive'){
      await syncDrive(silencio);
      S.settings.nube.last = new Date().toISOString();
      save(); render(); pintarNube('ok');
      if(!silencio) toast('Sincronizado con Google Drive');
      sincronizando = false;
      return;
    }
    const n = NUBE(), id = await idDe(n.pass);
    const base = n.url.replace(/\/+$/, '') + '/rest/v1/taskflow';
    const r = await fetch(base + '?id=eq.' + id + '&select=data', { headers:nubeHeaders() });
    if(!r.ok) throw new Error('HTTP ' + r.status);
    const filas = await r.json();
    if(filas && filas[0] && filas[0].data){
      try{
        const remoto = await descifrar(filas[0].data, n.pass);
        if(remoto && Array.isArray(remoto.tasks)){
          const ajustes = S.settings;
          S = fusionar(remoto);
          S.settings = ajustes;
        }
      }catch(e){ throw new Error('clave'); }
    }
    const cuerpo = { id, data: await cifrar({ tasks:S.tasks, projects:S.projects, notes:S.notes, habits:S.habits, deleted:S.deleted || [] }, n.pass), updated_at:new Date().toISOString() };
    const w = await fetch(base, { method:'POST', headers:nubeHeaders(), body:JSON.stringify(cuerpo) });
    if(!w.ok) throw new Error('HTTP ' + w.status);
    S.settings.nube.last = new Date().toISOString();
    save(); render();
    pintarNube('ok');
    if(!silencio) toast('Sincronizado con la nube');
  }catch(e){
    pintarNube('error');
    if(!silencio) toast(String(e.message) === 'clave' ? 'La clave secreta no coincide' : 'No pude sincronizar: ' + e.message);
  }finally{ sincronizando = false; }
}
function pintarNube(estado){
  $$('[data-nube]').forEach(el => { el.dataset.nube = estado; });
}
function syncPronto(){
  if(!nubeLista()) return;

/* ---- recordatorios (mientras la app está abierta) ---- */
const notificadas = new Set();
function disparar(t, tipo){
  const clave = t.id + '-' + tipo;
  if(notificadas.has(clave)) return;
  notificadas.add(clave);
  const cuando = tipo === 'pre' ? `en ${t.remind} min` : 'ahora';
  const msg = `${t.title} · ${t.time} (${cuando})`;
  ladrido('aviso');
  try{
    if(window.Notification && Notification.permission === 'granted')
      new Notification('Bruce te recuerda', { body:msg });
  }catch(e){}
  bruceDice(`⏰ ${tipo === 'now' ? 'Es la hora' : 'Faltan ' + t.remind + ' min'}: "${t.title}" a las ${t.time}.`, true);
  toast('⏰ ' + msg, 'Ver', () => { ui.day = t.date; goView('agenda'); });
}
function checkReminders(){
  const now = new Date();
  S.tasks.forEach(t => {
    if(!t.time || isDone(t)) return;
    const p = String(t.time).split(':');
    const dt = fromKey(t.date); dt.setHours(Number(p[0]) || 0, Number(p[1]) || 0, 0, 0);
    const fin = dt.getTime() + 3600000;
    if(t.remind){
      const pre = dt.getTime() - t.remind * 60000;
      if(now.getTime() >= pre && now.getTime() < dt.getTime()) disparar(t, 'pre');
    }
    if(now.getTime() >= dt.getTime() && now.getTime() <= fin) disparar(t, 'now');
  });
  /* horarios de hábitos: aviso a la hora si no está marcado */
  const d0 = today(), hhmm = pad(now.getHours()) + ':' + pad(now.getMinutes());
  S.habits.forEach(h => {
    habHoras(h).forEach(t => {
      const clave = 'hab-' + h.id + '-' + d0 + '-' + t;
      if(notificadas.has(clave)) return;
      const v = h.log && h.log[d0];
      const hecho = v === true || (v && v[t]);
      if(hecho || t > hhmm) return;
      const [hh, mm] = t.split(':').map(Number);
      const dt = new Date(); dt.setHours(hh, mm, 0, 0);
      if(now.getTime() - dt.getTime() > 45 * 60000) return;   /* no avisa por horarios muy pasados */
      notificadas.add(clave);
      ladrido('aviso');
      try{
        if(window.Notification && Notification.permission === 'granted')
          new Notification('Bruce te recuerda', { body:`${h.icon || ''} ${h.name} · ${t}` });
      }catch(e){}
      bruceDice(`${h.icon || '🔄'} Toca "${h.name}" (${t}). ¿Ya lo hiciste?`, true);
    });
  });
  bruceVigila();
}
function pedirPermisoNotif(){
  try{ if(window.Notification && Notification.permission === 'default') Notification.requestPermission(); }catch(e){}
}

    case 'close':       closeModal(); break;

    case 'go-day':      ui.day = el.dataset.k; ui.calMonth = el.dataset.k.slice(0,7); ui.view = 'agenda'; ui.q = ''; $('#search').value = ''; render(); break;
    case 'cal': {
      const ref = fromKey((ui.calMonth || today().slice(0,7)) + '-01');
      ref.setMonth(ref.getMonth() + Number(el.dataset.d));
      ui.calMonth = ref.getFullYear() + '-' + pad(ref.getMonth() + 1);
      renderSide(); break;
    }
    case 'week':        ui.day = key(addDays(fromKey(ui.day || today()), Number(el.dataset.d) * 7)); render(); break;
    case 'sub-add':     addSub(); break;
    case 'sub-toggle':  modalSubs[Number(el.dataset.i)].done = !modalSubs[Number(el.dataset.i)].done; refreshSubs(); break;
    case 'sub-del':     modalSubs.splice(Number(el.dataset.i), 1); refreshSubs(); break;
    case 'export':      exportData(); break;
    case 'share':       compartirCopia(); break;
    case 'imp-merge':   if(impAplicar) impAplicar('combinar'); break;
    case 'imp-replace': if(impAplicar) impAplicar('reemplazar'); break;
    case 'import':      if($('#importFile')) $('#importFile').click(); break;
    case 'reset':       resetData(); break;
    case 'edit-name':   nameModal(); break;
    case 'bruce':
      if($('#brucePanel').classList.contains('open')) cerrarBruce();
      else { ladrido('saludo'); abrirBruce(); }
      break;
    case 'bruce-close': cerrarBruce(); break;
    case 'bruce-ask':   preguntarBruce(el.dataset.q); break;
    case 'mic':         dictar(el.dataset.destino); break;
    case 'scan':        abrirEscaner(); break;
    case 'scan-shot':   capturarFoto(); break;
    case 'scan-create': crearDesdeEscaneo(); break;
    case 'scan-close':  cerrarCamara(); closeModal(); break;
    case 'nube':        nubeModal(el.dataset.tipo); break;
    case 'sync-now':    sincronizar(); break;
    case 'nube-off':    S.settings.nube = null; gisToken = null; save(); closeModal(); render(); toast('Nube desconectada'); break;
    case 'tg-bruce':    S.settings.bruce = S.settings.bruce === false; save(); render(); toast('Bruce ' + (S.settings.bruce ? 'activo' : 'en silencio')); break;
    case 'tg-sound':    S.settings.sound = S.settings.sound === false; save(); render(); if(S.settings.sound) ladrido('saludo'); toast('Ladridos ' + (S.settings.sound ? 'activados' : 'silenciados')); break;
    case 'test-alarm':  unlockAudio(); ladrido('aviso'); pedirPermisoNotif(); toast('Así te avisa Bruce'); break;
    case 'test-hola':   unlockAudio(); ladrido('saludo'); toast('¡Guau!'); break;
    case 'edit-task':   taskModal(id); break;
    case 'del-task':    delTask(id); break;
    case 'date-task':   dateModal(id); break;
    case 'proj-task':   projPickModal(id); break;
    case 'quickdate':   setTaskDate(id, key(addDays(new Date(), Number(el.dataset.d)))); closeModal(); break;
    case 'toggle':      toggleTask(id); break;

                        ui.view = 'proyectos'; ui.project = id; ui.q = ''; $('#search').value = ''; render(); window.scrollTo(0,0); break;
    case 'back-proj':   ui.project = null; render(); break;
    case 'new-proj':    projectModal(null); break;

/* ---- arrastrar tarjetas entre columnas del kanban ---- */
let arrastrando = null;
document.addEventListener('dragstart', e => {
  const c = e.target.closest && e.target.closest('[data-drag]');
  if(!c) return;
  arrastrando = c.dataset.drag;
  c.classList.add('arrastrando');
  try{ e.dataTransfer.setData('text/plain', arrastrando); e.dataTransfer.effectAllowed = 'move'; }catch(err){}
});
document.addEventListener('dragend', e => {
  const c = e.target.closest && e.target.closest('[data-drag]');
  if(c) c.classList.remove('arrastrando');
  $$('.col.destino').forEach(x => x.classList.remove('destino'));
  arrastrando = null;
});
document.addEventListener('dragover', e => {
  const col = e.target.closest && e.target.closest('[data-col]');
  if(!col || !arrastrando) return;
  e.preventDefault();
  try{ e.dataTransfer.dropEffect = 'move'; }catch(err){}
  if(!col.classList.contains('destino')){
    $$('.col.destino').forEach(x => x.classList.remove('destino'));
    col.classList.add('destino');
  }
});
document.addEventListener('dragleave', e => {
  const col = e.target.closest && e.target.closest('[data-col]');
  if(col && !col.contains(e.relatedTarget)) col.classList.remove('destino');
});
document.addEventListener('drop', e => {
  const col = e.target.closest && e.target.closest('[data-col]');
  if(!col) return;
  e.preventDefault();
  const id = arrastrando || (e.dataTransfer && e.dataTransfer.getData('text/plain'));
  col.classList.remove('destino');
  if(!id) return;
  const t = taskById(id);
  if(!t || t.status === col.dataset.col) return;
  setStatus(id, col.dataset.col);
  toast(col.dataset.col === 'completada' ? 'Completada' : (col.dataset.col === 'proceso' ? 'En proceso' : 'Pendiente'));
});

/* atajos */
document.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase();
  const typing = tag === 'input' || tag === 'textarea' || tag === 'select';
  if(e.key === 'Escape'){
    if(backdrop.classList.contains('open')) closeModal();
    else if(ui.q){ ui.q = ''; $('#search').value = ''; render(); $('#search').blur(); }
    return;
  }
  if(e.target.id === 'subInput' && e.key === 'Enter'){ e.preventDefault(); addSub(); return; }
  if(typing || e.ctrlKey || e.metaKey || e.altKey) return;
  if(e.key === '/'){ e.preventDefault(); $('#search').focus(); return; }
  if(e.key === 'n' || e.key === 'N'){ e.preventDefault(); taskModal(null); return; }
  if(e.key === 'm' || e.key === 'M'){ e.preventDefault(); noteModal(null); return; }
});
